<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>daily deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="banner">
  <svg class="banner-scene" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice">
    <rect width="1200" height="260" fill="url(#bannerGrad)" />
    <defs>
      <linearGradient id="bannerGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f3d9c9" />
        <stop offset="50%" stop-color="#e9c9b6" />
        <stop offset="100%" stop-color="#cdd8c9" />
      </linearGradient>
    </defs>
    <!-- branch -->
    <path d="M1050 260 C1040 180, 1080 140, 1100 60" stroke="#8a6a56" stroke-width="3" fill="none" opacity="0.6" />
    <g opacity="0.75">
      <circle cx="1075" cy="150" r="7" fill="#d98a86" />
      <circle cx="1095" cy="120" r="7" fill="#d98a86" />
      <circle cx="1060" cy="110" r="7" fill="#d98a86" />
      <circle cx="1090" cy="80" r="7" fill="#d98a86" />
    </g>
    <!-- steam -->
    <path d="M430 90 Q440 60 428 30" stroke="#fff" stroke-width="4" fill="none" opacity="0.55" stroke-linecap="round" />
    <path d="M460 90 Q470 55 458 20" stroke="#fff" stroke-width="4" fill="none" opacity="0.45" stroke-linecap="round" />
    <!-- mug -->
    <ellipse cx="445" cy="175" rx="95" ry="26" fill="#5a4636" opacity="0.15" />
    <path d="M360 100 h170 v70 a85 85 0 0 1 -170 0 z" fill="#fdf8f0" />
    <path d="M530 120 q40 5 40 35 q0 30 -40 30" fill="none" stroke="#fdf8f0" stroke-width="14" />
    <ellipse cx="445" cy="100" rx="85" ry="16" fill="#8a5a3e" />
    <ellipse cx="445" cy="100" rx="65" ry="10" fill="#c9906a" />
    <!-- laptop corner -->
    <path d="M900 260 L980 190 L1200 190 L1200 260 Z" fill="#fdf8f0" opacity="0.85" />
    <rect x="960" y="150" width="200" height="45" rx="4" fill="#e9ded0" opacity="0.85" />
  </svg>

  <div class="mascot" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="#c9a984" />
      <circle cx="22" cy="24" r="16" fill="#c9a984" />
      <circle cx="98" cy="24" r="16" fill="#c9a984" />
      <circle cx="22" cy="24" r="7" fill="#a9805a" />
      <circle cx="98" cy="24" r="7" fill="#a9805a" />
      <circle cx="40" cy="58" r="6" fill="#4a3728" />
      <circle cx="80" cy="58" r="6" fill="#4a3728" />
      <ellipse cx="60" cy="76" rx="12" ry="9" fill="#e8d5c0" />
      <circle cx="60" cy="72" r="3" fill="#4a3728" />
    </svg>
  </div>
</div>

<div class="page">

  <div class="title-row">
    <h1 class="page-title">| daily deck</h1>
    <p class="page-subtitle">a cozy corner for today's list</p>
  </div>

  <div class="affirmation-bar">
    🤎 <strong>today's focus:</strong> <span id="affirmationText">small steps still count.</span>
  </div>

  <div class="app">

    <aside class="sidebar">
      <div class="cream-label">-lists</div>
      <nav class="list-nav" id="listNav"></nav>

      <form class="new-list-form" id="newListForm">
        <input type="text" id="newListInput" placeholder="+ new list" autocomplete="off" />
      </form>

      <div class="sidebar-bottom">
        <label class="import-btn">
          🗓️ import calendar (.ics)
          <input type="file" id="icsInput" accept=".ics" hidden />
        </label>
        <p class="sidebar-hint">jarvis reads from here, open it in the same browser and it'll know your day</p>
      </div>
    </aside>

    <main class="board">
      <div class="board-header">
        <div>
          <h2 id="boardTitle">today</h2>
          <p class="board-sub" id="boardSub"></p>
        </div>
        <div class="date-block">
          <div class="date-block-part">
            <span class="date-num" id="dateMonth">--</span>
            <span class="date-label">month</span>
          </div>
          <div class="date-block-part">
            <span class="date-num" id="dateDay">--</span>
            <span class="date-label" id="dateWeekday">day</span>
          </div>
        </div>
      </div>

      <div class="cream-label">-add something</div>

      <form class="add-task-form" id="addTaskForm">
        <input type="text" id="taskTitleInput" placeholder="add a task and hit enter&hellip;" autocomplete="off" />
        <input type="date" id="taskDateInput" />
        <select id="taskPriorityInput">
          <option value="low">low</option>
          <option value="medium" selected>medium</option>
          <option value="high">high</option>
        </select>
        <button type="submit">add</button>
      </form>

      <div class="cream-label">-the list</div>

      <div class="task-list" id="taskList"></div>
    </main>

  </div>

</div>

<div class="overlay" id="notesOverlay">
  <div class="notes-card">
    <div class="notes-header">
      <h2 id="notesTaskTitle"></h2>
      <button class="close-btn" id="closeNotesBtn" aria-label="Close">&times;</button>
    </div>
    <textarea id="notesTextarea" placeholder="notes for this task&hellip;"></textarea>
    <div class="notes-actions">
      <button class="danger-link" id="deleteTaskBtn">delete task</button>
      <button class="save-btn" id="saveNotesBtn">save</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
